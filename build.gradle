plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.version
group = project.group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = true
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Plain JUnit, same as the Fabric tree. NeoForge's unit-test classloader treats argon.mixin as a
// mixin package and refuses to load MixinInjectionTest, so Minecraft is added to the test classpath
// directly instead.
configurations.named('testCompileClasspath') {
    extendsFrom(configurations.named('compileClasspath').get())
}
configurations.named('testRuntimeClasspath') {
    extendsFrom(configurations.named('compileClasspath').get())
}

test {
    useJUnitPlatform()
    systemProperty 'argon.mainClasses', sourceSets.main.output.classesDirs.asPath
    systemProperty 'argon.mainResources', sourceSets.main.output.resourcesDir
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xlint:all' << '-Werror'
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
