plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.148'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

neoForge {
	enable {
		version = project.neo_version
		// The decompile/recompile pipeline is deliberately left on. The layout mixins capture
		// vanilla locals by name, and the local variable table only carries those names in a
		// jar that was produced by recompiling the decompiled sources. The pipeline that skips
		// recompilation hands back a jar whose locals are still the obfuscated ones, so every
		// `@Local(name = ...)` capture would fail to resolve at runtime.
	}

	runs {
		client {
			client()
		}
		server {
			server()
			programArgument '--nogui'
		}
		configureEach {
			logLevel = org.slf4j.event.Level.INFO
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}

	unitTest {
		// The unit tests run inside the loader, because the game registries a jigsaw block
		// state comes from are only populated once the loader is up.
		enable()
		testedMod = mods."${mod_id}"
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The unit tests run against the Minecraft classes the mod compiles against, so the test
// classpath has to carry the modding dependencies as well.
configurations.named('testCompileClasspath') {
	extendsFrom(configurations.named('compileClasspath').get())
}
configurations.named('testRuntimeClasspath') {
	extendsFrom(configurations.named('compileClasspath').get())
}

test {
	useJUnitPlatform()
	systemProperty 'argon.mainClasses', sourceSets.main.output.classesDirs.asPath
	systemProperty 'argon.mainResources', sourceSets.main.output.resourcesDir
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

processResources {
	// The metadata is filled in from the project properties, so the version and the version
	// ranges cannot drift away from the build. The values are read here rather than inside the
	// task, because a task may not reach back into the project while it runs.
	def version = project.version
	def modId = project.mod_id
	def modName = project.mod_name
	def modLicense = project.mod_license
	def minecraftRange = project.minecraft_version_range
	def neoRange = project.neo_version_range

	inputs.property "version", version
	inputs.property "mod_id", modId
	inputs.property "mod_name", modName
	inputs.property "mod_license", modLicense
	inputs.property "minecraft_version_range", minecraftRange
	inputs.property "neo_version_range", neoRange

	filesMatching("META-INF/neoforge.mods.toml") {
		expand(
			"version": version,
			"mod_id": modId,
			"mod_name": modName,
			"mod_license": modLicense,
			"minecraft_version_range": minecraftRange,
			"neo_version_range": neoRange
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs << '-Xlint:all' << '-Werror'
}

// The licence is shipped next to the mod classes under its own name, so the jar carries the
// licence of the project it came from. The name is read here rather than inside the task, so the
// task does not reach back into the project while it runs.
def licenceName = project.archives_base_name
jar {
	from("LICENSE") {
		rename { "${it}_${licenceName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
